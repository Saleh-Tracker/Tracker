<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ساعات العمل</title>
<meta name="theme-color" content="#1f4e8c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arbeitszeiten">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1b2430;--muted:#6b7686;--line:#e2e7ef;--brand:#1f4e8c;--brand2:#e8eef7;--ok:#1e8a4c;--bad:#c0392b;--warn:#b7791f;--night:#4b3f9e;--sun:#b7791f;--hol:#c0392b;--warnbg:#fff6e5;--warnfg:#7a5200;--warnbd:#f0d49a;--vac:#1e8a4c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161d;--card:#1a212b;--ink:#e6ebf2;--muted:#95a1b2;--line:#2a3340;--brand:#6fa3e8;--brand2:#22324a;--ok:#4cc27e;--bad:#ef6b5b;--warn:#e3b04b;--night:#a99cf2;--sun:#e3b04b;--hol:#ef6b5b;--warnbg:#3a2e14;--warnfg:#f0d49a;--warnbd:#6b5420}}
:root[data-theme="dark"]{--bg:#11161d;--card:#1a212b;--ink:#e6ebf2;--muted:#95a1b2;--line:#2a3340;--brand:#6fa3e8;--brand2:#22324a;--ok:#4cc27e;--bad:#ef6b5b;--warn:#e3b04b;--night:#a99cf2;--sun:#e3b04b;--hol:#ef6b5b;--warnbg:#3a2e14;--warnfg:#f0d49a;--warnbd:#6b5420}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px;padding-bottom:76px}
header{background:#1f4e8c;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0}
header .st{font-size:12px;opacity:.85}
main{padding:12px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
textarea{min-height:120px;direction:ltr;text-align:left}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g-time{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 72px}.g-time input{padding-inline:6px;min-width:0}#f-pause{text-align:center}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px}.chk input{width:auto}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
button{border:0;border-radius:10px;padding:13px 16px;font-size:16px;min-height:46px;font-family:inherit;cursor:pointer;background:var(--brand);color:#fff}
button.sec{background:var(--brand2);color:var(--brand)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btns button{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 4px;font-size:12px}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--brand);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.res td:first-child{color:var(--muted)}
.big{font-size:22px;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kpi{background:var(--brand2);border-radius:10px;padding:10px}.kpi span{display:block;font-size:12px;color:var(--muted)}
.day{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.day:last-child{border-bottom:0}
.day .d{font-weight:700}.day .s{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;margin-inline-start:4px;color:#fff}
.t-n{background:var(--night)}.t-s{background:var(--sun)}.t-h{background:var(--hol)}.t-x{background:var(--muted)}
.warn{background:var(--warnbg);color:var(--warnfg);border:1px solid var(--warnbd);border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:9}
.hidden{display:none!important}
.q{display:inline-block;margin-top:4px;background:#f0b429;color:#1b2430;font-size:12px;border-radius:10px;padding:2px 8px;cursor:pointer}
.tip{display:flex;gap:8px;align-items:flex-start}.tip span{flex:1}.tip button{padding:2px 8px;background:transparent;color:inherit;border:1px solid currentColor}
#print{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--brand2);color:var(--brand);border-radius:22px;padding:10px 0;min-width:56px;font-weight:700}
.chip.on{background:var(--brand);color:#fff}
.mini{padding:6px 12px;min-height:34px;font-size:13px}
.savebar{position:sticky;bottom:72px;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.14);margin-bottom:12px}
.savebar .live{flex:1;line-height:1.2}.savebar .live span{display:block;font-size:12px;color:var(--muted)}.savebar .live b{font-size:22px}
.savebar button{flex:0 0 40%}
.sum{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.sum .kpi b{font-size:18px;white-space:nowrap}.sum .kpi:first-child b{font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);padding:0;min-height:0}
.cell small{font-size:9px;font-weight:400;opacity:.9}
.cell.today{outline:2px solid var(--brand)}
.c-work{background:var(--brand2);color:var(--brand);border-color:transparent}
.c-night{background:var(--night);color:#fff;border-color:transparent}
.c-sun{background:var(--sun);color:#fff;border-color:transparent}
.c-hol{background:var(--hol);color:#fff;border-color:transparent}
.c-urlaub{background:var(--vac);color:#fff;border-color:transparent}
.c-ausfall{background:var(--muted);color:#fff;border-color:transparent}
.c-travel{background:var(--card);border:2px solid var(--brand)}
.c-miss{border:2px dashed var(--bad);background:transparent;color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:4px}
.verdict{font-size:17px;font-weight:700;padding:12px;border-radius:10px;margin-bottom:10px;text-align:center}
.verdict.ok{background:rgba(30,138,76,.12);color:var(--ok)}.verdict.bad{background:rgba(192,57,43,.12);color:var(--bad)}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
@media print{
  body{padding:0;background:#fff;color:#000}
  header,nav,main,.toast{display:none!important}
  #print{display:block;font-family:Arial,sans-serif;direction:ltr;font-size:11px;color:#000}
  #print table{font-size:10px}#print td,#print th{border:1px solid #000;padding:3px}
  #print h1{font-size:16px;text-align:center;margin:8px 0}
}
</style>
</head>
<body>
<header><div><h1 id="hTitle">ساعات العمل</h1><div class="st" id="hStatus"></div><div class="q hidden" id="qBadge"></div></div><div style="display:flex;gap:6px"><button class="sec mini hidden" id="installBtn" data-t="install"></button><button class="sec mini" id="themeBtn">◐</button><button class="sec mini" id="langBtn">DE</button></div></header>
<main>
  <div class="warn tip hidden" id="iosTip"><span data-t="iosTip"></span><button id="iosTipX">✕</button></div>
  <!-- DAY -->
  <section id="v-day">
    <div class="card" id="sumCard"></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2 id="formTitle" style="margin:0"></h2><button class="sec mini" id="copyBtn" data-t="copyLast"></button></div>
      <div class="row">
        <div><label data-t="date"></label><input type="date" id="f-date"></div>
        <div><label data-t="type"></label><select id="f-type"></select></div>
      </div>
      <div class="g-place"><label data-t="place"></label><input id="f-place"></div>
      <div class="g-func"><label data-t="func"></label><select id="f-func" class="hidden"></select><div class="chips" id="funcChips"></div><div class="hint" id="funcName"></div></div>
      <div class="row3 g-time">
        <div><label data-t="start"></label><input type="time" id="f-start"></div>
        <div><label data-t="end"></label><input type="time" id="f-end"></div>
        <div><label data-t="pause"></label><input type="number" step="0.25" min="0" id="f-pause"></div>
      </div>
      <div class="g-hours"><label data-t="paidHours"></label><input type="number" step="0.25" min="0" id="f-hours"><div class="hint" data-t="paidHint"></div></div>
      <div class="g-km"><label data-t="route"></label><input id="f-route"></div>
      <div class="row g-km">
        <div><label data-t="km"></label><input type="number" min="0" id="f-km"></div>
        <div class="chk"><input type="checkbox" id="f-pass"><span data-t="passenger"></span></div>
      </div>
      <label data-t="notes"></label><input id="f-notes">
      <div class="btns">
        <button class="sec hidden" id="newBtn" data-t="newEntry"></button>
        <button class="danger hidden" id="delBtn" data-t="delete"></button>
      </div>
    </div>
    <div class="savebar"><div class="live"><span data-t="net"></span><b id="liveNet">0,00 €</b></div><button id="saveBtn" data-t="save"></button></div>
    <div class="card"><details id="resDet"><summary data-t="result"></summary><div id="dayResult"></div></details></div>
  </section>

  <!-- MONTH -->
  <section id="v-month" class="hidden">
    <div class="card"><div class="row"><div><label data-t="month"></label><input type="month" id="m-month"></div><div style="display:flex;align-items:flex-end"><button class="sec" style="width:100%" id="xlsBtn" data-t="excel"></button></div></div>
      <label data-t="outMode"></label><select id="outMode"><option value="jspdf" data-t="modeJs"></option><option value="print" data-t="modePrint"></option></select>
      <div class="btns"><button id="outAll" data-t="outAll"></button></div>
      <div class="btns" style="margin-top:8px"><button class="sec" id="outHours" style="padding:13px 6px">Stundennachweis</button><button class="sec" id="outCalc" style="padding:13px 6px">Berechnung</button></div>
    </div>
    <div id="missing"></div>
    <div class="card"><div id="calendar"></div></div>
    <div class="card"><h2 data-t="chartTitle"></h2><div id="chart"></div></div>
    <div class="card"><details><summary data-t="dayListT"></summary><div id="dayList"></div></details></div>
    <div class="card"><h2 data-t="totals"></h2><div id="monthTotals"></div></div>
    <div class="card"><h2 data-t="adjustments"></h2><div id="adjList"></div>
      <div class="row3"><div><label data-t="adjHours"></label><input type="number" step="0.25" id="a-hours"></div><div><label data-t="adjRate"></label><input type="number" step="0.01" id="a-rate"></div><div><label data-t="adjAmount"></label><input type="number" step="0.01" id="a-amount"></div></div>
      <label data-t="adjNote"></label><input id="a-note">
      <div class="btns"><button class="sec" id="adjBtn" data-t="addAdj"></button></div>
    </div>
  </section>

  <!-- COMPARE -->
  <section id="v-cmp" class="hidden">
    <div class="card"><label data-t="month"></label><input type="month" id="c-month"><div class="hint" data-t="cmpHint"></div></div>
    <div class="card"><h2 data-t="payslip"></h2><div id="slipForm"></div><div class="btns"><button id="slipBtn" data-t="saveSlip"></button></div></div>
    <div class="card"><div id="cmpVerdict"></div><div id="cmpTable"></div><div class="btns"><button class="sec" id="mailBtn" data-t="copyMail"></button></div></div>
  </section>

  <!-- SETTINGS -->
  <section id="v-set" class="hidden">
    <div class="card"><h2 data-t="connection"></h2>
      <label data-t="url"></label><input id="s-url" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec">
      <label data-t="key"></label><input id="s-key" dir="ltr">
      <div class="hint" data-t="localNote"></div>
      <div class="btns"><button id="connBtn" data-t="connect"></button></div>
      <div class="btns"><button class="sec" id="linkBtn" data-t="mkLink"></button></div>
      <div id="linkBox" class="hidden" style="margin-top:10px">
        <div class="hint" data-t="linkHint"></div>
        <div id="qr" style="background:#fff;padding:12px;border-radius:10px;width:max-content;margin:10px auto"></div>
        <input id="linkTxt" dir="ltr" readonly>
        <div class="btns"><button class="sec" id="copyLinkBtn" data-t="copyLink"></button><button class="sec" id="shareLinkBtn" data-t="shareLink"></button></div>
      </div>
    </div>
    <div class="card"><h2 data-t="rates"></h2><div id="rateForm"></div></div>
    <div class="card"><h2 data-t="rules"></h2><div id="ruleForm"></div></div>
    <div class="card"><h2 data-t="holidays"></h2><textarea id="s-hol"></textarea><div class="hint" data-t="holHint"></div></div>
    <div class="btns" style="margin-bottom:12px"><button id="setBtn" data-t="saveSettings"></button></div>
  </section>
</main>
<nav>
  <button data-v="day" class="on"><b>✎</b><span data-t="tabDay"></span></button>
  <button data-v="month"><b>▦</b><span data-t="tabMonth"></span></button>
  <button data-v="cmp"><b>⇄</b><span data-t="tabCmp"></span></button>
  <button data-v="set"><b>⚙</b><span data-t="tabSet"></span></button>
</nav>
<div class="toast" id="toast"></div>
<div id="print"></div>

/*ENGINE-START*/
const FUNCS=['A','C','H','M','U','X','Z','CU'];
const r2=x=>Math.round((Number(x)||0)*100)/100;
const num=x=>Number(String(x==null?'':x).replace(',','.').trim())||0;
function hm(s){const p=String(s||'').split(':');return (+p[0]||0)*60+(+p[1]||0);}
function rateFor(f,S){const b=num(S['rate_'+f]);return b?b+num(S.raise):0;}
function splitMinutes(e,S,hol){
  const [y,m,d]=e.date.split('-').map(Number);const t0=Date.UTC(y,m-1,d);
  const s=hm(e.start);let en=hm(e.end);if(en<=s)en+=1440;
  const nf=num(S.nightFrom)*60,nt=num(S.nightTo)*60,nightOK=(e.func==='C'||e.func==='CU');
  const mins=[];
  for(let k=s;k<en;k++){
    const dt=new Date(t0+k*60000);const mod=dt.getUTCHours()*60+dt.getUTCMinutes();
    const n=nightOK&&(nf>nt?(mod>=nf||mod<nt):(mod>=nf&&mod<nt));
    const su=dt.getUTCDay()===0;const ho=hol.has(dt.toISOString().slice(0,10));
    mins.push({n,su,ho,p:(n?num(S.nightPct):0)+(su?num(S.sunPct):0)+(ho?num(S.holPct):0)});
  }
  mins.sort((a,b)=>a.p-b.p); // الاستراحة تُخصم من الدقائق الأقل إضافة أولاً
  const kept=mins.slice(Math.min(Math.round(num(e.pause)*60),mins.length));
  const c={n:0,su:0,ho:0,work:kept.length};kept.forEach(x=>{if(x.n)c.n++;if(x.su)c.su++;if(x.ho)c.ho++;});
  return c;
}
function calcEntry(e,S,hol){
  const r={rate:0,base:0,nightH:0,sunH:0,holH:0,nightAmt:0,sunAmt:0,holAmt:0,kmAmt:0,meal:0,taxable:0,taxfree:0,net:0,actualH:0};
  const ph=num(e.paidHours);
  const pass=(e.passenger===true||e.passenger==='true'||e.passenger==='TRUE');
  if(e.type!=='urlaub') r.kmAmt=r2(num(e.km)*(pass?num(S.kmRatePass):num(S.kmRate)));
  if(e.type==='work'||e.type==='ausfall'){
    r.rate=rateFor(e.func,S);r.base=r2(ph*r.rate);
    const thr=num(S.mealThreshold);r.meal=ph>thr?num(S.mealHigh):(ph>=thr&&ph>0?num(S.mealLow):0);
  }else if(e.type==='urlaub'){r.rate=num(S.vacRate);r.base=r2(ph*r.rate);}
  if(e.type==='work'&&e.start&&e.end&&e.date){
    const c=splitMinutes(e,S,hol);r.nightH=c.n/60;r.sunH=c.su/60;r.holH=c.ho/60;r.actualH=c.work/60;
    const b=num(S.surBase);
    r.nightAmt=r2(r.nightH*b*num(S.nightPct)/100);r.sunAmt=r2(r.sunH*b*num(S.sunPct)/100);r.holAmt=r2(r.holH*b*num(S.holPct)/100);
  }
  r.taxable=r.base;r.taxfree=r2(r.nightAmt+r.sunAmt+r.holAmt+r.kmAmt+r.meal);
  r.net=r2(r.taxable*(1-num(S.deductPct)/100)+r.taxfree);
  return r;
}
function monthSummary(month,entries,adjs,S,hol){
  const list=entries.filter(e=>String(e.date).startsWith(month)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const t={workHours:0,vacHours:0,km:0,base:0,nightH:0,sunH:0,holH:0,nightAmt:0,sunAmt:0,holAmt:0,kmAmt:0,meal:0,adjHours:0,adjAmt:0,fixed:0};
  list.forEach(e=>{const c=calcEntry(e,S,hol);
    if(e.type==='urlaub')t.vacHours+=num(e.paidHours);else if(e.type!=='travel')t.workHours+=num(e.paidHours);
    t.km+=num(e.km);['base','nightH','sunH','holH','nightAmt','sunAmt','holAmt','kmAmt','meal'].forEach(k=>t[k]+=c[k]);});
  adjs.filter(a=>a.month===month).forEach(a=>{t.adjHours+=num(a.hours);t.adjAmt+=r2(num(a.hours)*num(a.rate)+num(a.amount));});
  Object.keys(t).forEach(k=>t[k]=r2(t[k]));
  t.taxable=r2(t.base+t.adjAmt);
  t.taxfree=r2(t.nightAmt+t.sunAmt+t.holAmt+t.kmAmt+t.meal);
  t.gross=r2(t.taxable+t.nightAmt+t.sunAmt+t.holAmt+t.kmAmt); // مثل Gesamt-Brutto في الكشف (بدون بدل الطعام)
  t.deduct=r2(t.taxable*num(S.deductPct)/100);
  t.net=r2(t.taxable-t.deduct+t.taxfree);
  t.hoursAll=t.workHours+t.adjHours;
  return {list,t};
}
/*ENGINE-END*/

function ls(k,v){try{if(v===undefined){const x=localStorage.getItem(k);return x?JSON.parse(x):null;}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}

db.settings=Object.assign({},DEF,clean(db.settings));

class NetErr extends Error{}
async function api(action,data){
  if(!cfg.url) return null; // الوضع المحلي: التخزين في localStorage فقط
  let j;
  try{
    const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),25000);
    const res=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:cfg.key,action,data}),signal:ctl.signal});
    clearTimeout(tm);j=await res.json();
  }catch(e){throw new NetErr(e.message||'network');}
  if(!j.ok)throw new Error(j.error);return j.data;
}
/* ---- قائمة الانتظار: تُحفظ العمليات على الهاتف وتُرسل عند عودة الإنترنت ---- */
let queue=ls('rw_queue')||[];
function saveQ(){ls('rw_queue',queue);renderQ();}
function renderQ(){const b=$('qBadge');if(!b)return;const n=queue.length;b.classList.toggle('hidden',!n);b.textContent=n===1?t('q1'):`${n} ${t('qN')}`;}
function enqueue(action,data){
  const id=data&&(data.id||data.month);
  if(['saveEntry','saveAdjustment','savePayslip'].includes(action))queue=queue.filter(q=>!(q.action===action&&(q.data.id||q.data.month)===id));
  if(action==='deleteEntry')queue=queue.filter(q=>!(q.action==='saveEntry'&&q.data.id===id));
  if(action==='deleteAdjustment')queue=queue.filter(q=>!(q.action==='saveAdjustment'&&q.data.id===id));
  if(action==='saveSettings'||action==='saveHolidays')queue=queue.filter(q=>q.action!==action);
  queue.push({action,data});saveQ();
}
async function write(action,data){
  if(!cfg.url)return 'local';
  if(queue.length||!navigator.onLine){enqueue(action,data);return 'queued';}
  try{await api(action,data);return 'ok';}
  catch(e){if(e instanceof NetErr){enqueue(action,data);return 'queued';}throw e;}
}
let flushing=false;
async function flush(){
  if(flushing||!queue.length||!cfg.url||!navigator.onLine)return;
  flushing=true;let sent=0;
  try{
    while(queue.length){
      const q=queue[0];
      try{await api(q.action,q.data);}
      catch(e){if(e instanceof NetErr)break;if(e.message==='auth'){toast(t('err')+'auth');break;}toast(t('err')+e.message);}
      queue.shift();saveQ();sent++;
    }
  }finally{flushing=false;}
  if(sent&&!queue.length)toast(t('sent'));
}
async function sync(){
  if(!cfg.url){setStatus(t('local'));renderQ();return;}
  setStatus(t('loading'));
  await flush();
  if(queue.length||!navigator.onLine){online=false;setStatus(t('offline'));renderAll();return;}
  try{const d=await api('getAll');
    db={settings:Object.assign({},DEF,clean(d.settings)),holidays:d.holidays.length?d.holidays:DEF_HOL,entries:d.entries,adjustments:d.adjustments,payslips:d.payslips};
    persist();online=true;
  }catch(e){online=false;if(!(e instanceof NetErr))toast(t('err')+e.message);}
  renderAll();
}

function fillForm(e){
  editId=e?e.id:null;
  const x=e||{date:today(),type:'work',func:'C',start:'22:00',end:'06:30',pause:'0.5',paidHours:'',km:'',passenger:false};

function dayClass(e,c){
  if(e.type==='urlaub')return 'c-urlaub';if(e.type==='ausfall')return 'c-ausfall';if(e.type==='travel')return 'c-travel';
  if(c.holH)return 'c-hol';if(c.sunH)return 'c-sun';if(c.nightH)return 'c-night';return 'c-work';
}
function renderCal(mon,list,hs,td){
  const [y,m]=mon.split('-').map(Number);const days=new Date(Date.UTC(y,m,0)).getUTCDate();
  const first=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7; // الإثنين أولاً
  const byDate={};list.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  const heads=[...Array(7)].map((_,i)=>new Date(Date.UTC(2024,0,1+i)).toLocaleDateString(cfg.lang==='de'?'de-DE':'ar',{weekday:'narrow',timeZone:'UTC'}));
  let h=heads.map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=days;d++){
    const ds=`${mon}-${String(d).padStart(2,'0')}`;const es=byDate[ds];const wd=new Date(Date.UTC(y,m-1,d)).getUTCDay();
    let cls='',sub='';
    if(es){const e=es[0];const c=calcEntry(e,S(),hs);cls=dayClass(e,c);sub=e.type==='urlaub'?'U':e.type==='ausfall'?'A':(e.type==='travel'?'km':fcode(e.func));}
    else if(ds<=td&&wd>0&&wd<6&&!hs.has(ds)){cls='c-miss';sub=t('calMiss');}
    h+=`<button type="button" class="cell ${cls} ${ds===td?'today':''}" data-date="${ds}" data-id="${es?es[0].id:''}">${d}${sub?`<small>${sub}</small>`:''}</button>`;
  }
  const L=(c,k)=>`<span><i class="${c}"></i>${t(k)}</span>`;
  $('calendar').innerHTML=`<div class="cal">${h}</div><div class="legend">${L('c-work','lgWork')}${L('c-night','lgNight')}${L('c-sun','lgSun')}${L('c-hol','lgHol')}${L('c-urlaub','lgVac')}${L('c-ausfall','lgAus')}${L('c-miss','lgMiss')}</div>`;
  document.querySelectorAll('#calendar .cell').forEach(b=>b.onclick=()=>{
    const e=b.dataset.id&&db.entries.find(x=>x.id===b.dataset.id);
    if(e)fillForm(e);else{fillForm(null);$('f-date').value=b.dataset.date;calcPreview();}
    show('day');
  });
}
function renderChart(mon,list,hs){
  const [y,m]=mon.split('-').map(Number);const days=new Date(Date.UTC(y,m,0)).getUTCDate();
  const v=Array(days).fill(0);list.forEach(e=>{const d=+e.date.slice(8,10);v[d-1]+=calcEntry(e,S(),hs).net;});
  const max=Math.max(...v,1);const W=days*12,H=110,bh=90;
  let bars='';v.forEach((x,i)=>{if(!x)return;const h=Math.max(2,x/max*bh);bars+=`<rect x="${i*12+2}" y="${bh-h}" width="8" height="${h}" rx="2" fill="var(--brand)"><title>${i+1}. ${eur(x)}</title></rect>`;});
  let lab='';[1,5,10,15,20,25,days].forEach(d=>{lab+=`<text x="${(d-1)*12+6}" y="${H-4}" font-size="9" text-anchor="middle" fill="var(--muted)">${d}</text>`;});
  $('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="direction:ltr;display:block"><line x1="0" y1="${bh}" x2="${W}" y2="${bh}" stroke="var(--line)"/>${bars}${lab}</svg><div class="hint" style="text-align:center">max ${eur(max)}</div>`;
}
function exportCSV(){
  const mon=$('m-month').value;const hs=holSet();const {list,t:tt}=monthSummary(mon,db.entries,db.adjustments,S(),hs);
  const n=x=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:2,useGrouping:false}).format(num(x));
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const head=['Datum','Art','Arbeitsstelle','Funktion','Beginn','Ende','Pause (h)','Arbeitszeit (h)','Strecke','Km','Mitfahrer','Stundenlohn','Grundlohn','Nacht h','N-Zuschlag','Sonntag h','So-Zuschlag','Feiertag h','FT-Zuschlag','Fahrgeld','Verpflegung','Netto (geschätzt)','Notiz'];
  const rows=list.map(e=>{const c=calcEntry(e,S(),hs);const p=e.date.split('-');
    return [p[2]+'.'+p[1]+'.'+p[0],T.de[e.type],e.place,e.type==='urlaub'||e.type==='travel'?'':fcode(e.func),e.start,e.end,n(e.pause),n(e.paidHours),e.route,n(e.km),(e.passenger===true||e.passenger==='true')?'ja':'',n(c.rate),n(c.base),n(c.nightH),n(c.nightAmt),n(c.sunH),n(c.sunAmt),n(c.holH),n(c.holAmt),n(c.kmAmt),n(c.meal),n(c.net),e.notes];});
  rows.push(['Gesamt','','','','','','',n(tt.workHours+tt.vacHours),'',n(tt.km),'','',n(tt.base),n(tt.nightH),n(tt.nightAmt),n(tt.sunH),n(tt.sunAmt),n(tt.holH),n(tt.holAmt),n(tt.kmAmt),n(tt.meal),n(tt.net),'']);
  const csv='\ufeff'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`Arbeitszeiten_${mon}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ================= COMPARE ================= */
const SLIP=[['hours','workHours','h'],['vacHours','vacHours','h'],['nightH','nightH','h'],['sunH','sunH','h'],['holH','holH','h'],['fahrgeld','fahrgeld','e'],['meals','meals','e'],['gross','gross','e'],['net','transfer','e']];
function renderCmp(){
  const mon=$('c-month').value;if(!mon)return;
  const p=db.payslips.find(x=>x.month===mon)||{};
  $('slipForm').innerHTML='<div class="row">'+SLIP.map(([k,l])=>`<div><label>${t(l)}</label><input type="number" step="0.01" id="p-${k}" value="${p[k]!==undefined?p[k]:''}"></div>`).join('')+'</div>';
  const {t:tt}=monthSummary(mon,db.entries,db.adjustments,S(),holSet());
  const app={hours:tt.hoursAll,vacHours:tt.vacHours,nightH:tt.nightH,sunH:tt.sunH,holH:tt.holH,fahrgeld:tt.kmAmt,meals:tt.meal,gross:tt.gross,net:tt.net};
  $('cmpTable').innerHTML=`<table><tr><th>${t('item')}</th><th class="n">${t('appV')}</th><th class="n">${t('slipV')}</th><th class="n">${t('diff')}</th></tr>`+
   SLIP.map(([k,l,u])=>{const a=app[k],has=p[k]!==undefined&&p[k]!=='';const s=num(p[k]);const d=r2(s-a);const f=u==='e'?eur:hrs;
    return `<tr><td>${t(l)}</td><td class="n">${f(a)}</td><td class="n">${has?f(s):'—'}</td><td class="n ${has&&Math.abs(d)>=0.01?(d<0?'neg':'pos'):''}">${has?(d>0?'+':'')+f(d):''}</td></tr>`;}).join('')+'</table>';
  const diffs=cmpDiffs(p,app);const key=['net','gross'].find(k=>p[k]!==undefined&&p[k]!=='');let v='';
  if(!key)v=`<div class="hint" style="text-align:center;margin-bottom:8px">${t('vNone')}</div>`;
  else{const d=r2(num(p[key])-app[key]);const extra=diffs.length?`<br><small style="font-weight:400">${diffs.length} ${t('vItems')}</small>`:'';
    v=Math.abs(d)<1?`<div class="verdict ok">${t('vOk')}${extra}</div>`:`<div class="verdict ${d<0?'bad':'ok'}">${t(d<0?'vLess':'vMore')} ${eur(Math.abs(d))}${extra}</div>`;}
  $('cmpVerdict').innerHTML=v;
}
function cmpDiffs(p,app){return SLIP.filter(([k])=>p[k]!==undefined&&p[k]!==''&&Math.abs(num(p[k])-app[k])>=0.01).map(([k,l,u])=>({k,u,a:app[k],s:num(p[k])}));}
const DE_LBL={hours:'Arbeitsstunden',vacHours:'Urlaubsstunden',nightH:'Nachtstunden (N-Zuschlag)',sunH:'Sonntagsstunden',holH:'Feiertagsstunden',fahrgeld:'Fahrgeld',meals:'Verpflegungszuschuss',gross:'Gesamt-Brutto',net:'Auszahlungsbetrag'};
async function copyMail(){
  const mon=$('c-month').value;const p=db.payslips.find(x=>x.month===mon)||{};SLIP.forEach(([k])=>{const el=$('p-'+k);if(el&&el.value!=='')p[k]=el.value;});
  const {t:tt}=monthSummary(mon,db.entries,db.adjustments,S(),holSet());
  const app={hours:tt.hoursAll,vacHours:tt.vacHours,nightH:tt.nightH,sunH:tt.sunH,holH:tt.holH,fahrgeld:tt.kmAmt,meals:tt.meal,gross:tt.gross,net:tt.net};
  const ds=cmpDiffs(p,app).filter(d=>d.k!=='gross'&&d.k!=='net');
  if(!ds.length){toast(t('noDiff'));return;}
  const f=(x,u)=>u==='e'?new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(x)+' €':new Intl.NumberFormat('de-DE',{maximumFractionDigits:2}).format(x)+' h';
  const [y,m]=mon.split('-');const mName=new Date(Date.UTC(+y,+m-1,1)).toLocaleDateString('de-DE',{month:'long',year:'numeric',timeZone:'UTC'});
  const txt=`Sehr geehrte Damen und Herren,\n\nbeim Abgleich meiner Lohnabrechnung für ${mName} mit meinen Stundennachweisen sind mir folgende Unterschiede aufgefallen:\n\n`+
    ds.map(d=>`- ${DE_LBL[d.k]}: laut meinen Aufzeichnungen ${f(d.a,d.u)}, laut Abrechnung ${f(d.s,d.u)}`).join('\n')+
    `\n\nKönnten Sie mir bitte erklären, wie diese Positionen berechnet wurden? Falls ein Fehler auf meiner Seite liegt, gebe ich gerne die korrigierten Angaben weiter.\n\nVielen Dank und freundliche Grüße\n${S().name||''}`;
  try{await navigator.clipboard.writeText(txt);toast(t('copied'));}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(t('copied'));}catch(_){prompt('',txt);}ta.remove();}
}
async function saveSlip(){
  const mon=$('c-month').value;if(!mon)return;const p={month:mon};SLIP.forEach(([k])=>p[k]=$('p-'+k).value);
  try{await write('savePayslip',p);}catch(err){toast(t('err')+err.message);return;}
  const i=db.payslips.findIndex(x=>x.month===mon);if(i>=0)db.payslips[i]=p;else db.payslips.push(p);persist();renderCmp();toast(t('saved'));
}

/* ================= SETTINGS ================= */
const RULES=['name','raise','surBase','nightPct','nightFrom','nightTo','sunPct','holPct','kmRate','kmRatePass','vacRate','vacHours','ausfallHours','mealThreshold','mealLow','mealHigh','deductPct'];
function renderSet(){
  $('s-url').value=cfg.url;$('s-key').value=cfg.key;
  $('rateForm').innerHTML='<div class="row">'+FUNCS.map(f=>`<div><label>${t('F_'+f)}</label><input inputmode="decimal" id="s-rate_${f}" value="${S()['rate_'+f]}"></div>`).join('')+'</div>';
  $('ruleForm').innerHTML='<div class="row">'+RULES.map(k=>`<div><label>${t(k)}</label><input ${k==='name'?'':'inputmode="decimal"'} id="s-${k}" value="${esc(S()[k])}"></div>`).join('')+'</div>';
  $('s-hol').value=db.holidays.map(h=>h.date+' '+h.name).join('\n');
}
async function saveSet(){
  const o={};FUNCS.forEach(f=>o['rate_'+f]=$('s-rate_'+f).value);RULES.forEach(k=>o[k]=$('s-'+k).value);Object.keys(o).forEach(k=>{if(k!=='name'){if(o[k]===''){delete o[k];}else o[k]=String(num(o[k]));}});
  const hol=$('s-hol').value.split('\n').map(l=>l.trim()).filter(l=>/^\d{4}-\d{2}-\d{2}/.test(l)).map(l=>({date:l.slice(0,10),name:l.slice(10).trim()}));
  try{await write('saveSettings',o);await write('saveHolidays',hol);}catch(err){toast(t('err')+err.message);return;}
  Object.assign(db.settings,o);db.holidays=hol;persist();toast(t('saved'));renderAll();
}
async function connect(){
  cfg.url=$('s-url').value.trim();cfg.key=$('s-key').value.trim();ls('rw_cfg',cfg);
  pushLocal();await sync();
}
/* يرفع البيانات المحلية الموجودة على هذا الجهاز إلى الشيت (مرة عند الربط) — بدون سؤال */
function pushLocal(){
  if(!cfg.url||!db.entries.length)return;
  enqueue('saveSettings',Object.assign({},db.settings));enqueue('saveHolidays',db.holidays);
  db.entries.forEach(e=>enqueue('saveEntry',e));db.adjustments.forEach(a=>enqueue('saveAdjustment',a));db.payslips.forEach(p=>enqueue('savePayslip',p));
}
/* ---- رابط الإعداد لمرة واحدة ---- */
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
function readSetupLink(){
  const m=location.hash.match(/setup=([\w\-]+)/);if(!m)return false;
  try{const o=b64d(m[1]);if(!o.u)return false;
    cfg.url=o.u;cfg.key=o.k||'';ls('rw_cfg',cfg);
    history.replaceState(null,'',location.pathname+location.search); // محو الرابط من شريط العنوان
    pushLocal();setTimeout(()=>toast(t('setupOk')),300);return true;
  }catch(e){return false;}
}
let qrLoading=null;
function loadQR(){if(window.QRCode)return Promise.resolve();if(!qrLoading)qrLoading=loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').catch(e=>{qrLoading=null;throw e;});return qrLoading;}
async function makeLink(){
  const u=$('s-url').value.trim()||cfg.url,k=$('s-key').value.trim()||cfg.key;
  if(!u){toast(t('needUrl'));return;}
  const link=location.origin+location.pathname+'#setup='+b64e({u,k});
  $('linkBox').classList.remove('hidden');$('linkTxt').value=link;$('qr').innerHTML='';
  try{await loadQR();new QRCode($('qr'),{text:link,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});}
  catch(e){$('qr').classList.add('hidden');toast(t('qrErr'));}
}

/* ================= NAV ================= */
function show(v){
  ['day','month','cmp','set'].forEach(x=>$('v-'+x).classList.toggle('hidden',x!==v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='month')renderMonth();if(v==='cmp')renderCmp();if(v==='set')renderSet();window.scrollTo(0,0);
}
function renderAll(){applyLang();const keep=editId?db.entries.find(x=>x.id===editId):null;fillForm(keep);renderMonth();renderCmp();renderSet();setStatus(cfg.url?(online&&navigator.onLine?t('online'):t('offline')):t('local'));renderQ();}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
['f-date','f-place','f-func','f-start','f-end','f-pause','f-hours','f-route','f-km','f-pass','f-notes'].forEach(i=>$(i).addEventListener('input',calcPreview));
$('f-type').addEventListener('change',()=>{typeVis(true);calcPreview();});
$('saveBtn').onclick=saveEntry;$('newBtn').onclick=()=>fillForm(null);$('delBtn').onclick=deleteEntry;
$('m-month').onchange=renderMonth;$('c-month').onchange=renderCmp;$('adjBtn').onclick=addAdj;$('outAll').onclick=()=>exportOut('all');$('outHours').onclick=()=>exportOut('hours');$('outCalc').onclick=()=>exportOut('calc');
$('outMode').value=cfg.outMode||'jspdf';$('outMode').onchange=()=>{cfg.outMode=$('outMode').value;ls('rw_cfg',cfg);};
$('slipBtn').onclick=saveSlip;$('mailBtn').onclick=copyMail;$('xlsBtn').onclick=exportCSV;$('copyBtn').onclick=copyLast;
$('themeBtn').onclick=()=>{const o=['auto','light','dark'];cfg.theme=o[(o.indexOf(cfg.theme||'auto')+1)%3];ls('rw_cfg',cfg);applyTheme();};applyTheme();$('setBtn').onclick=saveSet;$('connBtn').onclick=connect;
$('langBtn').onclick=()=>{cfg.lang=cfg.lang==='de'?'ar':'de';ls('rw_cfg',cfg);renderAll();};
const curM=today().slice(0,7);$('m-month').value=curM;$('c-month').value=curM;
readSetupLink();
renderAll();sync();
window.addEventListener('online',()=>sync());
window.addEventListener('offline',()=>{online=false;setStatus(t('offline'));});
let lastSync=Date.now();
const autoSync=()=>{if(cfg.url&&navigator.onLine&&!flushing){lastSync=Date.now();sync();}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(queue.length||Date.now()-lastSync>60000))autoSync();});
setInterval(()=>{if(document.hidden)return;if(queue.length||Date.now()-lastSync>5*60000)autoSync();},60000);
$('linkBtn').onclick=makeLink;
$('copyLinkBtn').onclick=async()=>{const v=$('linkTxt').value;try{await navigator.clipboard.writeText(v);}catch(e){$('linkTxt').select();document.execCommand('copy');}toast(t('copied'));};
$('shareLinkBtn').onclick=()=>{const v=$('linkTxt').value;if(navigator.share)navigator.share({title:t('app'),url:v}).catch(()=>{});else $('copyLinkBtn').click();};
window.addEventListener('hashchange',()=>{if(readSetupLink())sync();});
$('qBadge').onclick=()=>sync();
/* ---- التثبيت كتطبيق (PWA) ---- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').classList.remove('hidden');});
$('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;$('installBtn').classList.add('hidden');};
window.addEventListener('appinstalled',()=>$('installBtn').classList.add('hidden'));
const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!isStandalone&&!ls('rw_iosTipX'))$('iosTip').classList.remove('hidden');
$('iosTipX').onclick=()=>{ls('rw_iosTipX',1);$('iosTip').classList.add('hidden');};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
